apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: lomax
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: 000000000000.dkr.ecr.us-east-1.localhost:4566/lomax-backend:8154c29
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: lomax-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lomax-db
                  key: DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: lomax
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
